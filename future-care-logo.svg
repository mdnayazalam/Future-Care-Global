<text x="251.9" y="243.1" transform="rotate(-49.4, 251.9, 243.1)" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#18181b" text-anchor="middle" dominant-baseline="central">U</text>
