<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Definitions & Styles -->
  <defs>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Group for whole badge -->
  <g filter="url(#badgeShadow)">
    <!-- Red Outer Circular Ring -->
    <circle cx="400" cy="370" r="230" fill="#E11D24" stroke="#D0171D" stroke-width="2" />

    <!-- Inner White Circle for Globe -->
    <circle cx="400" cy="370" r="160" fill="#ffffff" stroke="#E11D24" stroke-width="1" />

    <!-- Globe Grid in Cyan Blue (#0088CC) -->
    <g id="globe" stroke="#0088CC" fill="none">
      <!-- Outer globe circle -->
      <circle cx="400" cy="370" r="150" stroke-width="4" />

      <!-- Horizontal equator -->
      <line x1="250" y1="370" x2="550" y2="370" stroke-width="3" />

      <!-- Parallels of latitude -->
      <ellipse cx="400" cy="370" rx="146" ry="46" stroke-width="2.5" />
      <ellipse cx="400" cy="370" rx="136" ry="92" stroke-width="2.5" />
      <ellipse cx="400" cy="370" rx="108" ry="128" stroke-width="2.2" />

      <!-- Prime meridian (vertical) -->
      <line x1="400" y1="220" x2="400" y2="520" stroke-width="3" />

      <!-- Meridians of longitude -->
      <ellipse cx="400" cy="370" rx="55" ry="150" stroke-width="2.5" />
      <ellipse cx="400" cy="370" rx="108" ry="150" stroke-width="2.5" />
    </g>

    <!-- Handshake Graphic in Center -->
    <g id="handshake" transform="translate(400, 370)">
      <!-- Left dark suit sleeve -->
      <polygon points="-125,18 -68,-32 -48,-12 -105,38" fill="#18181b" />
      <!-- Left white cuff -->
      <polygon points="-69,-33 -60,-41 -40,-21 -49,-13" fill="#ffffff" stroke="#18181b" stroke-width="2.5" />

      <!-- Right dark suit sleeve -->
      <polygon points="125,18 68,-32 48,-12 105,38" fill="#18181b" />
      <!-- Right white cuff -->
      <polygon points="69,-33 60,-41 40,-21 49,-13" fill="#ffffff" stroke="#18181b" stroke-width="2.5" />

      <!-- Clasped hands base silhouette -->
      <path d="M -48,-14 C -35,-28 -12,-32 10,-22 C 28,-14 36,4 32,22 C 26,38 8,44 -16,40 C -36,36 -48,18 -48,-14 Z" fill="#ffffff" stroke="#18181b" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Right hand dark clasp -->
      <path d="M 48,-14 C 35,-28 12,-32 -10,-22 C -28,-14 -36,4 -32,22 C -26,38 -8,44 16,40 C 36,36 48,18 48,-14 Z" fill="#18181b" stroke="#18181b" stroke-width="4" stroke-linejoin="round" />

      <!-- Interlocked fingers detail -->
      <!-- White hand fingers wrapped over dark hand -->
      <path d="M -18,-14 C -6,-22 14,-22 24,-12 C 30,-5 28,3 20,8 C 12,12 -8,12 -18,-2 Z" fill="#ffffff" stroke="#18181b" stroke-width="3" />
      <path d="M -20,-2 C -8,-10 12,-10 20,0 C 26,7 24,14 16,19 C 8,23 -9,23 -20,11 Z" fill="#ffffff" stroke="#18181b" stroke-width="3" />
      <path d="M -24,10 C -12,3 8,3 15,13 C 21,20 19,27 11,32 C 3,35 -14,35 -24,24 Z" fill="#ffffff" stroke="#18181b" stroke-width="3" />

      <!-- Top thumb clasp detail -->
      <path d="M -38,-10 C -24,-34 2,-32 8,-18 C 12,-9 6,1 -8,8 C -22,12 -34,7 -38,-10 Z" fill="#ffffff" stroke="#18181b" stroke-width="3.5" />
      <path d="M 38,-10 C 24,-34 -2,-32 -8,-18 C -12,-9 -6,1 8,8 C 22,12 34,7 38,-10 Z" fill="#18181b" stroke="#ffffff" stroke-width="2" />
    </g>

